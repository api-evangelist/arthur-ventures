aid: arthur-ventures
name: Arthur Ventures
description: >-
  Arthur Ventures is a Minneapolis, Minnesota venture capital firm that invests in early-stage B2B
  software companies with a global reach. The firm backs capital-efficient, founder-led software
  businesses across the United States and internationally, partnering with teams building enterprise
  and vertical SaaS, cybersecurity, developer tools, and data infrastructure. Arthur Ventures manages
  approximately $2B in assets under management, including roughly $800M in current active funds, and
  supports a portfolio of 60+ active companies. Notable portfolio investments include ThreatLocker,
  DNSFilter, Nucleus Security, DataCamp, Total Expert, Recast Software, CertifID, Hudu, Stream, and
  Macabacus. The firm is led by general partners Patrick Meenan, Ryan Kruizenga, and Andrew Heim, with
  offices at 250 Nicollet Mall in downtown Minneapolis.
